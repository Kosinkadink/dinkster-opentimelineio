name: Build wheels

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      target:
        type: string
        required: true
      full:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read source pin
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pin = json.loads(Path('source.json').read_text())
          print(f"repository={pin['repository']}")
          print(f"commit={pin['commit']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Prepare downstream distribution
        run: python scripts/prepare_source.py upstream
      - name: Build and test repaired wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae
        with:
          package-dir: upstream
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ inputs.full && 'cp312-* cp313-* cp314-*' || 'cp314-*' }}
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: ${{ inputs.target == 'linux-aarch64' && 'aarch64' || 'x86_64' }}
          CIBW_ARCHS_WINDOWS: ${{ inputs.target == 'windows-arm64' && 'ARM64' || 'AMD64' }}
          CIBW_ARCHS_MACOS: arm64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD_LINUX: yum install -y zlib-devel
          CIBW_BEFORE_BUILD_WINDOWS: vcpkg install zlib:${{ inputs.target == 'windows-arm64' && 'arm64-windows' || 'x64-windows' }} && python -m pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_PREFIX_PATH=C:/vcpkg/installed/${{ inputs.target == ''windows-arm64'' && ''arm64-windows'' || ''x64-windows'' }} PATH="C:/vcpkg/installed/${{ inputs.target == ''windows-arm64'' && ''arm64-windows'' || ''x64-windows'' }}/bin;$PATH"'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path C:/vcpkg/installed/${{ inputs.target == 'windows-arm64' && 'arm64-windows' || 'x64-windows' }}/bin -w {dest_dir} {wheel}
          CIBW_ENVIRONMENT_MACOS: 'CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=arm64" MACOSX_DEPLOYMENT_TARGET=11.0'
          CIBW_TEST_REQUIRES: urllib3
          CIBW_TEST_COMMAND: python -m unittest discover -s {package}/tests -t {package} && python {package}/../scripts/check_runtime.py
          CIBW_TEST_COMMAND_WINDOWS: 'cd /d "{package}" && python -m unittest discover -s tests -t . && python ../scripts/check_runtime.py'
      - name: Validate wheel identities and record source provenance
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          FULL: ${{ inputs.full }}
        run: |
          python -m pip install packaging twine
          python -m twine check wheelhouse/*.whl
          args=()
          if [ "$FULL" = true ]; then args+=(--full); fi
          python scripts/validate_wheels.py wheelhouse --target "$TARGET" "${args[@]}"
          cp upstream/LICENSE.txt wheelhouse/OpenTimelineIO-LICENSE.txt
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pin = json.loads(Path('source.json').read_text())
          pin['submodules'] = subprocess.check_output(['git', '-C', 'upstream', 'submodule', 'status', '--recursive'], text=True).splitlines()
          pin['target'] = os.environ['TARGET']
          Path(f"wheelhouse/source-{pin['target']}.json").write_text(json.dumps(pin, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ inputs.target }}
          path: wheelhouse/
          if-no-files-found: error
