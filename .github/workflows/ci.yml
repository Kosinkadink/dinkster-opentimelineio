name: Wheel CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install packaging ruff
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: python -m unittest discover -s tests -v
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x64
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
