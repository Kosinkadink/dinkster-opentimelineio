name: Wheel CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: windows-2022
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Read source pin
        id: source
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pin = json.loads(Path('source.json').read_text())
          print(f"repository={pin['repository']}")
          print(f"commit={pin['commit']}")
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          submodules: recursive
          path: upstream
          persist-credentials: false
      - name: Prepare downstream distribution
        run: python scripts/prepare_source.py upstream
      - name: Build and test repaired wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae
        with:
          package-dir: upstream
          output-dir: wheelhouse
        env:
          CIBW_BUILD: cp314-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD_LINUX: yum install -y zlib-devel
          CIBW_BEFORE_BUILD_WINDOWS: vcpkg install zlib:x64-windows && python -m pip install delvewheel
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_PREFIX_PATH=C:/vcpkg/installed/x64-windows PATH="C:/vcpkg/installed/x64-windows/bin;$PATH"'
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: python -m delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin -w {dest_dir} {wheel}
          CIBW_TEST_REQUIRES: urllib3
          CIBW_TEST_COMMAND: python -m unittest discover -s {package}/tests -t {package}
          CIBW_TEST_COMMAND_WINDOWS: 'cd /d "{package}" && python -m unittest discover -s tests -t .'
      - name: Check package metadata and installed import
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check wheelhouse/*.whl
          python -m pip install --no-deps wheelhouse/*.whl
          python - <<'PY'
          import json
          import importlib.metadata
          from pathlib import Path
          import opentimelineio
          pin = json.loads(Path('source.json').read_text())
          version = importlib.metadata.version('dinkster-opentimelineio')
          assert version == pin['version']
          assert opentimelineio.__version__ == pin['upstream_version']
          print(opentimelineio.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error
