name: Release wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/build.yml
      - scripts/**
      - source.json

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag agrees with source version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('source.json').read_text())['version']
          if os.environ['EVENT'] == 'push':
              assert os.environ['REF'] == f'refs/tags/v{version}', 'Tag must match source.json version'
          PY
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: windows-2022
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
          - os: macos-15
            target: macos-arm64
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      full: true
  validate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Require the complete release wheel set
        run: |
          python -m pip install packaging twine
          python scripts/validate_wheels.py dist --target all --full
          python -m twine check dist/*.whl
          test -s dist/OpenTimelineIO-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels
          path: dist/
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: dist/*
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dinkster-opentimelineio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-wheels
          path: dist
      - name: Select wheels for PyPI
        run: |
          mkdir wheels
          mv dist/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: wheels/
